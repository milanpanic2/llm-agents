replicaCount: 2

image:
  registry: ghcr.io/milanpanic2
  name: llm-agents
  tag: main
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  host: llm-agents.homelab.com
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer

config:
  appHost: "0.0.0.0"
  appPort: "8000"
  debug: "false"
  environment: "default"
  maxConcurrentTranscriptions: 2
  jwtAlgorithm: "HS256"
  jwtExpirationMinutes: "1440"
  otelEndpoint: "http://alloy.monitoring.svc.cluster.local:4317"
  crwBase: "http://crw.crw.svc.cluster.local:3000"
  llmBaseUrl: "http://llama-server.llama-server.svc.cluster.local:8090"
  llmModel: "./Qwen3.6-35B-A3B-UD-IQ4_NL.gguf"
  llmApiKey: "local"
  valkeyServiceUrl: "valkey.valkey.svc.cluster.local"
  valkeyServicePort: "6379"
  garageEndpoint: "garage.garage.svc.cluster.local"
  garageAccessKey: "GK87197f668e14d94fe448c84a"
  garageSecretKey: "8605e7350f071d3b49f3f4610c11f5f05c99cc2a623c18d81421df749a816d87"

database:
  host: "postgresql"
  port: "5432"
  name: "llm-agents"
  secretName: "cluster-secret"

resources:
  requests:
    memory: "256Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"
    cpu: "250m"

probes:
  liveness:
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5

middleware:
  enabled: true
